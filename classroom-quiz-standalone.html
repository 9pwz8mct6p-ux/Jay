<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องเรียนควิซ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f0ea;--card:#fff;--tx:#1b2a22;--mut:#62736a;--bd:#cfdcd2;--ac:#2b6a4f;--ok:#2f9e44;--no:#e03131;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201a;--card:#1f2d25;--tx:#eef4ef;--mut:#93a89b;--bd:#33463b;--ac:#4cae84;--ok:#51cf66;--no:#ff6b6b}}
:root[data-theme="dark"]{--bg:#15201a;--card:#1f2d25;--tx:#eef4ef;--mut:#93a89b;--bd:#33463b;--ac:#4cae84;--ok:#51cf66;--no:#ff6b6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Sarabun","Noto Sans Thai",system-ui,sans-serif}
.w{max-width:960px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0}
.m{color:var(--mut);margin:6px 0 14px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut)}
.tm{font-size:32px;color:var(--tx);min-width:48px;text-align:right}
.qt{font-size:clamp(24px,4.5vw,40px);margin:12px 0 18px;line-height:1.3}
.qt2{font-size:22px;margin:12px 0}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.og.p{grid-template-columns:1fr}
.o{border:0;border-radius:12px;color:#fff;font:inherit;font-weight:700;padding:18px 14px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:64px;width:100%}
.o small{font-weight:400;opacity:.9}
.o.dim{opacity:.35}
.b{display:block;width:100%;margin:18px 0 0;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:18px}
.b:disabled{opacity:.4}
.g{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:10px;padding:8px 14px;font:inherit}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tc{border:2px solid;border-radius:12px;padding:10px;background:var(--card);color:var(--tx);font:inherit;display:flex;flex-direction:column;gap:2px;text-align:left}
.tc small{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.chip{display:inline-block;color:#fff;padding:4px 12px;border-radius:99px;font-weight:700;margin-bottom:6px}
.ok{color:var(--ok)}.no{color:var(--no)}
.bd{margin-top:16px}
.rw{display:flex;align-items:center;gap:8px;padding:6px 0}
.rk{width:22px;color:var(--mut)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.nm{width:64px;flex:none}
.bw{flex:1;background:var(--bd);border-radius:6px;height:12px;overflow:hidden}
.br{height:100%;border-radius:6px;transition:width .6s}
.big{font-size:64px;color:#fff;text-align:center;border-radius:16px;padding:24px;margin-top:16px}
details{margin-top:16px}
.ft{text-align:center;margin-top:28px}
.msg{background:var(--no);color:#fff;border-radius:10px;padding:8px 12px;margin-top:12px}
@media(max-width:560px){.og{grid-template-columns:1fr}}
:root{--wall:#eaf0f5;--floor:#dde2e7;--desk:rgba(150,205,230,.55);--ft:#26323c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#26323c;--floor:#39424a;--desk:rgba(120,180,210,.45);--ft:#e6edf2}}
:root[data-theme="dark"]{--wall:#26323c;--floor:#39424a;--desk:rgba(120,180,210,.45);--ft:#e6edf2}
.rm{border-radius:16px;overflow:hidden;border:3px solid #aeb8c0;background:var(--wall)}
.wl{display:flex;align-items:flex-end;gap:10px;padding:40px 10px 0;border-bottom:4px solid #b6c0c8}
.bdx{flex:1;min-width:0;background:#fff;color:#1f2a37;border:6px solid #c4ccd3;border-radius:6px;padding:10px 12px;margin-bottom:12px;box-shadow:0 4px 0 #9aa5ad,0 6px 10px rgba(0,0,0,.18)}
.bdx h2{margin:6px 0 8px;font-size:clamp(17px,3.6vw,28px);line-height:1.3;color:#1c4fb8}
.bdx .top{color:#5b6770}.bdx .tm{font-size:22px;color:#1f2a37;min-width:36px}
.ch{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid rgba(31,42,55,.15);color:inherit;font:inherit;font-size:clamp(15px,3vw,22px);padding:7px 4px}
.ch.on{background:rgba(28,126,214,.16)}.ch.dim{opacity:.4}.ch.rt{color:#2b8a3e;font-weight:700}
.m2{margin:8px 0 0;color:#5b6770;font-size:14px}
.tch{position:relative;width:76px;flex:none}.tch svg{width:100%;display:block}
.sp{position:absolute;right:4px;bottom:100%;z-index:2;background:#fff;color:#222;border-radius:10px;padding:4px 9px;font-size:12px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.fl{background:linear-gradient(rgba(128,140,150,.3) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(128,140,150,.3) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(160deg,rgba(255,255,255,.25),transparent 40%),var(--floor);color:var(--ft);padding:14px 8px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px}
.dk{text-align:center}.dk.cl{cursor:pointer}.dk svg{width:100%;height:auto;display:block}
.dk.sel svg{filter:drop-shadow(0 0 5px #ffd43b)}
.dl{font-size:12px;line-height:1.3}.dl small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sc{font-weight:700}
.rm{border-radius:2px;border:4px solid #6b3f1d;box-shadow:inset 0 0 0 3px #d9a15a,0 0 0 3px #3b2412}
.wl{background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.05) 30px 32px)}
.bdx{border-radius:0;border:4px solid #b8c1c9;box-shadow:0 0 0 3px #6e7a85,5px 5px 0 3px rgba(0,0,0,.22)}
.sp{border-radius:0;border:3px solid #6b3f1d;background:#fff4d6;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.fl{background:repeating-conic-gradient(rgba(120,135,150,.2) 0 25%,transparent 0 50%) 0 0/56px 56px,var(--floor)}
.tch{width:88px}
.dk svg,.tch svg{image-rendering:pixelated}
.b{border-radius:4px;border:3px solid #1d3f30;box-shadow:0 4px 0 #1d3f30}.b:active{transform:translateY(3px);box-shadow:0 1px 0 #1d3f30}
.g{border-radius:4px;border:2px solid var(--bd)}
.ch{overflow-wrap:anywhere}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="app" class="w"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TC=['#e03131','#f76707','#e8a200','#2f9e44','#0ca678','#1c7ed6','#4263eb','#9c36b5','#d6336c'];
const AC=['#d93a3a','#1c7ed6','#d99100','#2f9e44'];
const SY=['▲','◆','●','■'];
const LIM=20;
const DEF=`เมืองหลวงของประเทศญี่ปุ่นคือเมืองใด?|โอซาก้า|โตเกียว|เกียวโต|ซัปโปโร|2
น้ำแข็งแห้งคือสารใดในสถานะของแข็ง?|ไนโตรเจน|ออกซิเจน|คาร์บอนไดออกไซด์|มีเทน|3
12 × 12 เท่ากับเท่าใด?|124|134|144|154|3
ดาวเคราะห์ดวงใดใหญ่ที่สุดในระบบสุริยะ?|ดาวเสาร์|ดาวพฤหัสบดี|ดาวยูเรนัส|ดาวเนปจูน|2
สัตว์ชนิดใดเป็นสัตว์เลี้ยงลูกด้วยนม?|ฉลาม|กบ|ปลาวาฬ|นกเพนกวิน|3
น้ำบริสุทธิ์เดือดที่กี่องศาเซลเซียส (ระดับน้ำทะเล)?|90|100|110|120|2`;
let db,user,uid,isHost=false,canW=null,asPlayer=false,edit=false,jn='',pt=0,QT='',msg='',lastKey='',done='';
let S={phase:'lobby'},P={},A={},K=null;
let seenAt=0;

function toast(t){msg=t;render(true);setTimeout(()=>{msg='';render(true)},3500)}

function parse(raw){
  return raw.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(p=>p.length>=6&&p[0]).map(p=>({t:p[0],o:p.slice(1,5),c:Math.min(3,Math.max(0,(parseInt(p[5])||1)-1))}));
}
const pub=q=>({t:q.t,o:q.o});

let mode=null,peer,conns=new Map(),hostConn,CODE='',synced=false,netMsg='กำลังเชื่อมต่อ…';
const PX='cqz';
try{uid=localStorage.getItem('cq_uid')}catch(e){}
if(!uid){uid='u'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('cq_uid',uid)}catch(e){}}
const joinUrl=()=>location.href.split('#')[0]+'#'+CODE;
function setS(d){
  if(d.phase==='q'&&(S.phase!=='q'||d.qi!==S.qi||d.gid!==S.gid))seenAt=Date.now();
  S=d;
}
function save(){try{localStorage.setItem('cq_host',JSON.stringify({code:CODE,S,P,K}))}catch(e){}}
function bc(){const m={t:'st',S,P,A};conns.forEach(c=>{if(c.open)c.send(m)})}
function put(d){setS(d);save();bc();render()}
function onMsg(m){
  if(!m||typeof m!=='object')return;
  const id=String(m.id||'').slice(0,24);
  if(!id)return;
  if(m.t==='join'){const tb=parseInt(m.tb);if(tb>=1&&tb<=9)P[id]={n:String(m.n||'').slice(0,20),tb}}
  else if(m.t==='ans'){if(S.phase==='q'&&m.g===S.gid&&m.q===S.qi&&m.c>=0&&m.c<=3&&!(A[id]&&A[id].g===S.gid&&A[id].q===S.qi))A[id]={g:m.g,q:m.q,c:m.c,d:Math.max(0,+m.d||0)}}
  save();bc();render();
}
function hostRoom(resume){
  let sv=null;
  if(resume){try{sv=JSON.parse(localStorage.getItem('cq_host'))}catch(e){}}
  CODE=sv?sv.code:String(1000+Math.floor(Math.random()*9000));
  if(sv){S=sv.S||S;P=sv.P||{};K=sv.K||null}
  mode='host';isHost=true;
  peer=new Peer(PX+CODE);
  peer.on('open',()=>{save();render(true)});
  peer.on('connection',c=>{
    c.on('open',()=>{conns.set(c.peer,c);c.send({t:'st',S,P,A})});
    c.on('data',onMsg);
    c.on('close',()=>conns.delete(c.peer));
  });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      peer.destroy();
      if(!sv)hostRoom();
      else{mode=null;isHost=false;toast('รหัสห้องนี้ยังถูกใช้อยู่ รอสักครู่แล้วลองใหม่')}
    }else toast('เชื่อมต่อไม่ได้ ('+e.type+')');
  });
}
function joinRoom(code){
  code=(code||($('#rc')&&$('#rc').value)||'').trim();
  if(!/^\d{4}$/.test(code)){toast('ใส่รหัสห้อง 4 หลัก');return}
  CODE=code;mode='play';netMsg='กำลังเชื่อมต่อ…';render(true);
  peer=new Peer();
  peer.on('open',()=>{
    hostConn=peer.connect(PX+code,{reliable:true});
    hostConn.on('data',m=>{if(m&&m.t==='st'){setS(m.S||{phase:'lobby'});P=m.P||{};A=m.A||{};synced=true;render()}});
    hostConn.on('close',()=>{synced=false;netMsg='การเชื่อมต่อหลุด';render(true)});
    hostConn.on('error',()=>{netMsg='เชื่อมต่อไม่ได้';render(true)});
  });
  peer.on('error',e=>{netMsg=e.type==='peer-unavailable'?'ไม่พบห้องรหัส '+code:'เชื่อมต่อไม่ได้ ('+e.type+')';render(true)});
  setTimeout(()=>{if(!synced){netMsg='เชื่อมต่อนานผิดปกติ รหัสห้องอาจไม่ถูก หรือเครือข่ายบล็อกการเชื่อมต่อ';render(true)}},15000);
}
{const h=location.hash.replace('#','');if(/^\d{4}$/.test(h))joinRoom(h);else render()}

function board(fin){
  const rows=[1,2,3,4,5,6,7,8,9].map(t=>({t,s:(S.ts&&S.ts[t])||0,g:(S.tg&&S.tg[t])||0,m:Object.values(P).filter(p=>p.tb===t).length})).filter(r=>r.m||r.s).sort((a,b)=>b.s-a.s);
  const mx=Math.max(1,...rows.map(r=>r.s));
  return `<div class="bd">${rows.map((r,i)=>`<div class="rw"><span class="rk">${i+1}</span><span class="dot" style="background:${TC[r.t-1]}"></span><span class="nm">โต๊ะ ${r.t}</span><div class="bw"><div class="br" style="width:${r.s/mx*100}%;background:${TC[r.t-1]}"></div></div><b>${r.s}</b>${!fin&&r.g?`<small class="ok">+${r.g}</small>`:''}</div>`).join('')}</div>`;
}

/* old list-style views
function hostView(){
  const n=Object.keys(P).length;
  if(S.phase==='q'&&S.q){
    const got=Object.values(A).filter(a=>a.g===S.gid&&a.q===S.qi).length;
    return ['hq'+S.qi+'-'+got,`<div class="top"><span>ข้อ ${S.qi+1} จาก ${S.n}</span><b id="tm" class="tm"></b></div><h1 class="qt">${esc(S.q.t)}</h1><div class="og">${S.q.o.map((o,i)=>`<div class="o" style="background:${AC[i]}"><span>${SY[i]} ${esc(o)}</span></div>`).join('')}</div><p class="m">ตอบแล้ว ${got} จาก ${n} คน</p><button class="b" onclick="reveal()">เฉลย</button>`];
  }
  if(S.phase==='r'&&S.q){
    return ['hr'+S.qi,`<div class="top"><span>เฉลยข้อ ${S.qi+1}</span></div><h1 class="qt">${esc(S.q.t)}</h1><div class="og">${S.q.o.map((o,i)=>`<div class="o ${i===S.cor?'':'dim'}" style="background:${AC[i]}"><span>${i===S.cor?'✓ ':''}${esc(o)}</span><small>${(S.cnt&&S.cnt[i])||0} คน</small></div>`).join('')}</div>${board()}<button class="b" onclick="next()">${S.qi+1>=S.n?'ดูผลรวม':'ข้อต่อไป'}</button>`];
  }
  if(S.phase==='end'){
    return ['he',`<h1>ผลรวมคะแนนโต๊ะ</h1>${board(true)}<button class="b" onclick="resetGame()">เล่นรอบใหม่</button>`];
  }
  const tb=[1,2,3,4,5,6,7,8,9].map(t=>{const m=Object.values(P).filter(p=>p.tb===t);return `<div class="tc" style="border-color:${TC[t-1]}"><b style="color:${TC[t-1]}">โต๊ะ ${t}</b><span>${m.length} คน</span><small>${m.map(p=>esc(p.n)).join(', ')}</small></div>`}).join('');
  return ['hl',`<h1>ห้องเรียนควิซ</h1><p class="m">ให้นักเรียนเปิดลิงก์นี้ ใส่ชื่อ และเลือกโต๊ะ ตอนนี้มี ${n} คน</p><div class="tg">${tb}</div><details ${QT?'open':''}><summary>แก้ไขคำถาม</summary><textarea id="qs" rows="9" oninput="QT=this.value">${esc(QT||DEF)}</textarea><p class="m">หนึ่งบรรทัดต่อหนึ่งข้อ: คำถาม|ตัวเลือก 1|2|3|4|เลขข้อที่ถูก (1-4)</p></details><button class="b" onclick="start()" ${n?'':'disabled'}>เริ่มเกม</button>`];
}

function playerView(){
  if(canW===false)return ['np','<h1>ยังส่งคำตอบไม่ได้</h1><p class="m">ให้ผู้จัดแชร์ลิงก์และตั้งสิทธิ์ของคุณเป็นผู้ร่วมใช้งาน (Contributor) แล้วเปิดหน้านี้ใหม่</p>'];
  const m=P[uid],n=Object.keys(P).length;
  if(!m||edit){
    return ['jn',`<h1>เข้าห้องเรียน</h1><input id="nm" maxlength="20" placeholder="ชื่อของคุณ" value="${esc(jn)}"><p class="m">เลือกโต๊ะของคุณ</p><div class="tg">${[1,2,3,4,5,6,7,8,9].map(t=>`<button class="tc" style="border-color:${TC[t-1]};${pt===t?`background:${TC[t-1]};color:#fff`:''}" onclick="pickT(${t})"><b>โต๊ะ ${t}</b></button>`).join('')}</div><button class="b" onclick="join()">เข้าร่วม</button>`];
  }
  const chip=`<div class="chip" style="background:${TC[m.tb-1]}">${esc(m.n)} · โต๊ะ ${m.tb}</div>`;
  const a=A[uid]&&A[uid].g===S.gid&&A[uid].q===S.qi?A[uid]:null;
  if(S.phase==='q'&&S.q){
    if(a)return ['pw'+S.qi,chip+`<h1>ส่งคำตอบแล้ว</h1><p class="m">รอผู้จัดเฉลย</p><div class="big" style="background:${AC[a.c]}">${SY[a.c]}</div>`];
    return ['pq'+S.qi,chip+`<div class="top"><span>ข้อ ${S.qi+1} จาก ${S.n}</span><b id="tm" class="tm"></b></div><h2 class="qt2">${esc(S.q.t)}</h2><div class="og p">${S.q.o.map((o,i)=>`<button class="o" style="background:${AC[i]}" onclick="ans(${i})"><span>${SY[i]} ${esc(o)}</span></button>`).join('')}</div>`];
  }
  if(S.phase==='r'&&S.q){
    const ok=a&&a.c===S.cor,pts=(S.pg&&S.pg[uid])||0;
    return ['pr'+S.qi,chip+`<h1 class="${ok?'ok':'no'}">${a?(ok?'ถูกต้อง +'+pts:'ยังไม่ถูก'):'ไม่ได้ตอบ'}</h1><p class="m">คำตอบที่ถูกคือ ${esc(S.q.o[S.cor])}</p>`+board()];
  }
  if(S.phase==='end')return ['pe',chip+'<h1>จบเกมแล้ว</h1>'+board(true)];
  return ['pl',chip+`<h1>รอผู้จัดเริ่มเกม</h1><p class="m">ตอนนี้มี ${n} คนในห้อง</p><button class="g" onclick="jn=P[uid].n;pt=P[uid].tb;edit=true;render(true)">เปลี่ยนชื่อหรือโต๊ะ</button>`];
}

*/
const LET=['ก','ข','ค','ง'];
const SKN=['#f2c9a0','#e0a878','#c68642','#8d5524','#f5d5b8'];
const sk=id=>SKN[[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%SKN.length];
const TCH='<svg viewBox="0 0 90 160"><line x1="62" y1="64" x2="86" y2="22" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><rect x="28" y="108" width="12" height="40" rx="4" fill="#33415c"/><rect x="48" y="108" width="12" height="40" rx="4" fill="#33415c"/><rect x="24" y="146" width="18" height="8" rx="4" fill="#1d1d1f"/><rect x="46" y="146" width="18" height="8" rx="4" fill="#1d1d1f"/><rect x="22" y="50" width="44" height="64" rx="12" fill="#2b6a4f"/><path d="M40 50l4 18 4-18z" fill="#e8a200"/><rect x="62" y="58" width="9" height="30" rx="4" fill="#2b6a4f" transform="rotate(-25 66 58)"/><rect x="12" y="58" width="9" height="40" rx="4" fill="#2b6a4f"/><circle cx="44" cy="30" r="17" fill="#e0a878"/><path d="M27 28a17 17 0 0134 0c-6-8-28-8-34 0z" fill="#3b2a20"/><circle cx="38" cy="32" r="5" fill="none" stroke="#222" stroke-width="1.5"/><circle cx="50" cy="32" r="5" fill="none" stroke="#222" stroke-width="1.5"/><path d="M39 42q5 4 10 0" stroke="#222" stroke-width="1.5" fill="none"/></svg>';
function topT(){let b=0,m=0;for(let t=1;t<=9;t++){const s=(S.ts&&S.ts[t])||0;if(s>m){m=s;b=t}}return b}
function mark(id){
  const a=A[id],ok=a&&a.g===S.gid&&a.q===S.qi;
  if(S.phase==='q')return ok?'✋':'';
  if(S.phase==='r')return !ok?'💤':a.c===S.cor?'⭐':'❌';
  return '';
}

const HC=['#3b2a20','#6b3f1d','#1f1f1f','#b5651d','#d9a441'];
const hs=id=>[...id].reduce((a,c)=>a+c.charCodeAt(0),0);
function SP(rows,pal){const d={};rows.forEach((r,y)=>[...r].forEach((c,x)=>{if(pal[c])d[c]=(d[c]||'')+`M${x} ${y}h1v1H${x}z`}));return Object.entries(d).map(([c,p])=>`<path d='${p}' fill='${pal[c]}'/>`).join('')}
const KID=['..hhhh..','.hhhhhh.','.hssssh.','.sesses.','.ssssss.','..bbbb..','.bbbbbb.','sbbbbbbs','sbbbbbbs'];
const TR=['...hhhhh...','..hhhhhhh..','..hsssssh..','..sggsggs..','..sssssss..','....sss....','.bbbbbbbbb.','sbbbbtbbbbs','sbbbbtbbbbs','s.bbbtbbb.s','..bbbbbbb..','..ppppppp..','..ppp.ppp..','..ppp.ppp..','..kkk.kkk..'];
const TCHP='<svg viewBox="0 0 11 15" shape-rendering="crispEdges">'+SP(TR,{h:'#3b2a20',s:'#e0a878',g:'#222',b:'#2b6a4f',t:'#e8a200',p:'#33415c',k:'#1d1d1f'})+'</svg>';
function desk(t,sel,click){
  const ms=Object.entries(P).filter(([,p])=>p.tb===t),c=TC[t-1],sc=(S.ts&&S.ts[t])||0,g=(S.tg&&S.tg[t])||0;
  const SL=[[5,8],[18,8],[31,8],[1,19],[35,19]];
  const st=ms.slice(0,5).map(([id],i)=>{const [x,y]=SL[i],h=hs(id);return `${id===uid?`<rect x='${x-.5}' y='${y-.5}' width='9' height='10' fill='none' stroke='#ffd43b'/>`:''}<g transform='translate(${x} ${y})'>${SP(KID,{h:HC[Math.floor(h/5)%5],s:SKN[h%5],e:'#2b1d14',b:c})}</g><text x='${x+4}' y='${y-2}' font-size='6' text-anchor='middle'>${mark(id)}</text>`}).join('');
  const more=ms.length>5?`<text x='43' y='6' font-size='4' fill='currentColor' text-anchor='end'>+${ms.length-5}</text>`:'';
  const crown=S.phase==='end'&&topT()===t?`<text x='22' y='6' font-size='7' text-anchor='middle'>👑</text>`:'';
  return `<div class='dk${click?' cl':''}${sel===t?' sel':''}' ${click?`onclick='pickT(${t})'`:''}><svg viewBox='0 0 44 39' shape-rendering='crispEdges'>${st}${more}<rect x='12.5' y='17.5' width='19' height='17' style='fill:var(--desk)' stroke='${c}'/><rect x='14' y='19' width='6' height='1' fill='#fff' fill-opacity='.8'/><rect x='19' y='23' width='6' height='6' fill='${c}'/><text x='22' y='27.8' font-size='5' font-weight='700' fill='#fff' text-anchor='middle'>${t}</text><rect x='13' y='35' width='2' height='4' fill='#8e9aa3'/><rect x='29' y='35' width='2' height='4' fill='#8e9aa3'/>${crown}</svg><div class='dl'><span class='sc'>${sc?sc+' คะแนน':'โต๊ะ '+t}</span>${g?` <span class='ok'>+${g}</span>`:''}<small>${ms.map(([,p])=>esc(p.n)).join(', ')}&nbsp;</small></div></div>`;
}
function room(bh,say,sel,click){
  return `<div class="rm"><div class="wl"><div class="bdx">${bh}</div><div class="tch"><div class="sp">${say}</div>${TCHP}</div></div><div class="fl">${[1,2,3,4,5,6,7,8,9].map(t=>desk(t,sel,click)).join('')}</div></div>`;
}
function qb(canAns,a){
  const top=`<div class="top"><span>ข้อ ${S.qi+1} จาก ${S.n}</span>${S.phase==='q'?'<b id="tm" class="tm"></b>':''}</div>`;
  const ls=S.q.o.map((o,i)=>{
    const cls=S.phase==='r'?(i===S.cor?'rt':'dim'):(a&&a.c===i?'on':'');
    const n=S.phase==='r'?` <small>(${(S.cnt&&S.cnt[i])||0})</small>`:'';
    return canAns?`<button class="ch" onclick="ans(${i})">${LET[i]}. ${esc(o)}</button>`:`<div class="ch ${cls}">${LET[i]}. ${esc(o)}${n}</div>`;
  }).join('');
  return top+`<h2>${esc(S.q.t)}</h2>`+ls;
}
function hostView(){
  const n=Object.keys(P).length;
  let bh,say,key,extra='',btn='';
  if(S.phase==='q'&&S.q){
    const got=Object.values(A).filter(a=>a.g===S.gid&&a.q===S.qi).length;
    bh=qb(false)+`<p class="m2">ตอบแล้ว ${got} จาก ${n} คน</p>`;say='ตั้งใจฟังนะ!';key='hq'+S.qi+'-'+got;btn='<button class="b" onclick="reveal()">เฉลย</button>';
  }else if(S.phase==='r'&&S.q){
    bh=qb(false);say='เฉลยแล้ว!';key='hr'+S.qi;btn=`<button class="b" onclick="next()">${S.qi+1>=S.n?'ดูผลรวม':'ข้อต่อไป'}</button>`;
  }else if(S.phase==='end'){
    bh=`<h2>จบเกมแล้ว</h2><div class="ch">${topT()?'โต๊ะ '+topT()+' ชนะ!':'ขอบคุณทุกคน'}</div>`;say='เก่งมากทุกโต๊ะ';key='he';extra=board(true);btn='<button class="b" onclick="resetGame()">เล่นรอบใหม่</button>';
  }else{
    bh=`<h2>ห้องเรียนควิซ</h2><div class="ch">รหัสห้อง ${CODE} · นักเรียนเปิด ${esc(joinUrl())}</div><div class="ch">ตอนนี้มี ${n} คนในห้อง</div>`;say='ยินดีต้อนรับ';key='hl';
    extra=`<details ${QT?'open':''}><summary>แก้ไขคำถาม</summary><textarea id="qs" rows="9" oninput="QT=this.value">${esc(QT||DEF)}</textarea><p class="m">หนึ่งบรรทัดต่อหนึ่งข้อ: คำถาม|ตัวเลือก 1|2|3|4|เลขข้อที่ถูก (1-4)</p></details>`;
    btn=`<button class="b" onclick="start()" ${n?'':'disabled'}>เริ่มเกม</button>`;
  }
  return [key,room(bh,say)+extra+btn];
}
function playerView(){
  if(canW===false)return ['np','<h1>ยังส่งคำตอบไม่ได้</h1><p class="m">ให้ผู้จัดแชร์ลิงก์และตั้งสิทธิ์ของคุณเป็นผู้ร่วมใช้งาน (Contributor) แล้วเปิดหน้านี้ใหม่</p>'];
  const m=P[uid],n=Object.keys(P).length;
  if(!m||edit){
    return ['jn',`<h1>เข้าห้องเรียน</h1><input id="nm" maxlength="20" placeholder="ชื่อของคุณ" value="${esc(jn)}"><p class="m">แตะโต๊ะที่อยากนั่ง</p>${room('<h2>ห้องเรียนควิซ</h2><div class="ch">เลือกโต๊ะ แล้วกดนั่งโต๊ะนี้</div>','สวัสดีนักเรียน',pt,true)}<button class="b" onclick="join()">นั่งโต๊ะนี้</button>`];
  }
  const a=A[uid]&&A[uid].g===S.gid&&A[uid].q===S.qi?A[uid]:null;
  let bh,say,key,extra='';
  if(S.phase==='q'&&S.q){
    bh=qb(!a,a);say=a?'ส่งแล้ว รอเฉลยนะ':'แตะคำตอบบนกระดาน';key='pq'+S.qi+(a?a.c:'');
  }else if(S.phase==='r'&&S.q){
    const ok=a&&a.c===S.cor,pts=(S.pg&&S.pg[uid])||0;
    bh=qb(false,a);say=a?(ok?'เก่งมาก +'+pts:'ไม่เป็นไรนะ'):'ไม่ได้ตอบนะ';key='pr'+S.qi;
  }else if(S.phase==='end'){
    bh=`<h2>จบเกมแล้ว</h2><div class="ch">${topT()?'โต๊ะ '+topT()+' ชนะ!':'ขอบคุณทุกคน'}</div>`;say='เก่งมากทุกโต๊ะ';key='pe';extra=board(true);
  }else{
    bh=`<h2>รอเริ่มเกม</h2><div class="ch">ตอนนี้มี ${n} คนในห้อง</div>`;say='รอเพื่อนก่อนนะ';key='pl';
    extra='<p class="ft"><button class="g" onclick="jn=P[uid].n;pt=P[uid].tb;edit=true;render(true)">เปลี่ยนชื่อหรือโต๊ะ</button></p>';
  }
  return [key,room(bh,say,m.tb)+extra];
}
function render(force){
  const app=$('#app');
  if(!mode){
    let sv=null;try{sv=JSON.parse(localStorage.getItem('cq_host'))}catch(e){}
    app.innerHTML=`<h1>ห้องเรียนควิซ</h1><p class="m">เกมตอบคำถามเป็นทีมแบบห้องเรียน ไม่ต้องสมัครหรือล็อกอิน</p><button class="b" onclick="hostRoom()">สร้างห้อง (ผู้จัด)</button>${sv?`<button class="g" style="margin-top:10px" onclick="hostRoom(1)">กลับเข้าห้อง ${esc(sv.code)}</button>`:''}<p class="m" style="margin-top:28px">นักเรียน ใส่รหัสห้อง</p><input id="rc" inputmode="numeric" maxlength="4" placeholder="รหัส 4 หลัก"><button class="b" onclick="joinRoom()">เข้าห้อง</button>`+(msg?`<div class="msg">${esc(msg)}</div>`:'');
    return;
  }
  if(mode==='play'&&!synced){app.innerHTML=`<h1>${esc(netMsg)}</h1><button class="g" onclick="location.reload()">ลองใหม่</button>`;return}
  const host=isHost&&!asPlayer;
  const [key,h]=host?hostView():playerView();
  const ae=document.activeElement;
  if(!force&&key===lastKey&&ae&&/INPUT|TEXTAREA/.test(ae.tagName))return;
  lastKey=key;
  const ft=isHost?`<p class="ft"><button class="g" onclick="asPlayer=!asPlayer;render(true)">${asPlayer?'กลับเป็นผู้จัด':'ลองเล่นเป็นผู้เล่น'}</button></p>`:'';
  app.innerHTML=h+(msg?`<div class="msg">${esc(msg)}</div>`:'')+ft;
}

function pickT(t){const e=$('#nm');if(e)jn=e.value;pt=t;render(true)}
function join(){
  const e=$('#nm'),n=((e&&e.value)||jn).trim().slice(0,20);
  if(!n||!pt){toast('ใส่ชื่อและเลือกโต๊ะก่อน');return}
  const m={t:'join',id:uid,n,tb:pt};
  if(isHost)onMsg(m);
  else if(hostConn&&hostConn.open){P[uid]={n,tb:pt};hostConn.send(m)}
  else{toast('ยังไม่ได้เชื่อมต่อกับห้อง');return}
  edit=false;render(true);
}
function ans(c){
  if(S.phase!=='q')return;
  const m={t:'ans',id:uid,g:S.gid,q:S.qi,c,d:Date.now()-seenAt};
  if(isHost){onMsg(m);return}
  if(hostConn&&hostConn.open){A[uid]={g:m.g,q:m.q,c,d:m.d};hostConn.send(m);render(true)}
}
function start(){
  const e=$('#qs'),qs=parse(e?e.value:(QT||DEF));
  if(!qs.length){toast('รูปแบบคำถามไม่ถูกต้อง');return}
  K={questions:qs};A={};
  put({phase:'q',gid:Date.now(),qi:0,n:qs.length,q:pub(qs[0]),t0:Date.now(),lim:LIM,ts:{},tg:{},pg:{}});
}
function reveal(){
  if(S.phase!=='q'||!K)return;
  const id=S.gid+':'+S.qi;if(done===id)return;done=id;
  const k=K.questions[S.qi],ts={...(S.ts||{})},pg={},tg={},cnt=[0,0,0,0];
  Object.entries(A).forEach(([pid,a])=>{
    if(a.g!==S.gid||a.q!==S.qi)return;
    cnt[a.c]++;
    const p=P[pid];
    if(a.c===k.c&&p){
      const pts=Math.round(500+500*Math.max(0,1-a.d/(S.lim*1000)));
      pg[pid]=pts;tg[p.tb]=(tg[p.tb]||0)+pts;ts[p.tb]=(ts[p.tb]||0)+pts;
    }
  });
  put({...S,phase:'r',cor:k.c,cnt,ts,pg,tg});
}
function next(){
  const i=S.qi+1;
  if(i>=S.n)put({...S,phase:'end'});
  else put({...S,phase:'q',qi:i,q:pub(K.questions[i]),t0:Date.now(),cor:null,cnt:null,pg:{},tg:{}});
}
function resetGame(){A={};put({phase:'lobby'})}

setInterval(()=>{
  const e=$('#tm');if(!e||S.phase!=='q')return;
  const host=isHost&&!asPlayer;
  const r=Math.max(0,Math.ceil(S.lim-(Date.now()-(host?S.t0:seenAt))/1000));
  e.textContent=r;
  if(host&&r<=0)reveal();
},300);
</script>
